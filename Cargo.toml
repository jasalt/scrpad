[package]
name = "scrpad"
version = "0.4.1"
edition = "2024"
# `scrpad-console` is the Windows `scrpad.com`; plain `cargo run` means the app.
default-run = "scrpad"
description = "A tiny frameless floating scratchpad with hidden and encrypted notes"
license = "MIT"
authors = ["Miika Havo"]
readme = "README.md"
repository = "https://github.com/mhavo/scrpad"
rust-version = "1.85"
keywords = ["notepad", "scratchpad", "egui", "encryption", "notes"]
categories = ["gui", "text-editors"]

[dependencies]
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "links"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
# preserve_order: hooks.json keeps the key order of the user's other hooks (src/agents.rs).
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
argon2 = "0.6"
blake2 = "0.11"
# Tells which agent files are scrpad's by digest (src/agents.rs); shares digest 0.11 with blake2.
sha2 = "0.11"
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
zeroize = "1"
# Only for "Check for updates…": one HTTPS request to GitHub, made when the user asks.
ureq = "3"
semver = "1"
# Reads the clipboard back to clear a copied secret only while it is still there (egui can
# only write it). Already in the tree through egui-winit, so it adds no crates.
arboard = { version = "3.6", default-features = false }
# One instance per user and the `scrpad --append/--list/--read` commands: a Unix domain socket
# (Linux, macOS) or a local-only named pipe (Windows) behind one API, so the code tested on
# Linux is the code that runs everywhere. Synchronous only, no tokio; small and maintained.
interprocess = "2.4"
# `scrpad --tui`: the same notes in a terminal. Crossterm through ratatui's re-export, so the
# two can't drift apart; it runs on Linux, macOS and Windows consoles alike. No widget set:
# the editor is our own, as no editor crate soft-wraps lines without a vim mode (src/tui/).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
# The editor's cursor steps over whole characters (é, emoji, CJK) and words; columns are counted
# with ratatui's own CellWidth, so they match what it draws. Already in the tree (ratatui, egui).
unicode-segmentation = "1"
# The injection scan (src/scan.rs) reads text the way a person does: NFKC folds fullwidth and
# ligature letters, script and category tables find lookalikes and invisible characters.
# Already in the tree through url/idna, so they add no crates.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }

# Only Windows builds embed the .exe icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The same on Wayland, through data-control: arboard would fall back to XWayland's X11
# clipboard, which can be stale, and egui's own Wayland clipboard needs the keyboard focus.
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"

# The terminal UI saves before it goes on SIGTERM and SIGHUP (terminal closed). Already in the
# tree through crossterm.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# The named pipe on Windows: a security descriptor that lets in only the current user
# (widestring for its SDDL string), and CancelIoEx to give its reads and writes a deadline,
# which named pipes lack. Both crates are already in the tree through interprocess. The console
# control handler lets the terminal UI save when its console window is closed.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Console"] }

# `--features console` also builds scrpad-console, which Windows releases ship as scrpad.com
# (src/bin/scrpad-console.rs); elsewhere the one `scrpad` binary does both.
[features]
console = []

[[bin]]
name = "scrpad-console"
path = "src/bin/scrpad-console.rs"
required-features = ["console"]

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

# Everyday release builds: without LTO only the changed crate is rebuilt (seconds, not minutes).
[profile.release]
opt-level = "s"
lto = false
strip = true

# The smallest binary for publishing (`cargo build --profile dist`): fat LTO over all of
# wgpu and egui on one codegen unit, which makes the final link take minutes.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Argon2id (64 MiB, t=5) takes seconds unoptimized; keep the crypto crates fast in dev and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
