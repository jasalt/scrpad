name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same gate first and builds nothing unless it passes.
  workflow_call:
    inputs:
      checks-only:
        description: Skip the macOS and Windows builds; the release builds those itself.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml runs this: never one group with CI on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The tools pinned in mise.toml: just, cargo-deny, typos, shfmt, shellcheck, actionlint, zizmor, gitleaks, jq.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # The headless UI tests render with wgpu; lavapipe gives them a software Vulkan adapter.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: just check
      - run: just secrets
      # Not in a release: its last job publishes every artifact of the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !inputs.checks-only
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore

  build:
    if: ${{ !inputs.checks-only }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --all-features
