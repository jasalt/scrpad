name: Release

# Pushing a tag like v0.1.0 runs the CI gate (ci.yml), then builds the `dist` profile on every platform (a universal
# .app on macOS) and publishes a GitHub release with the archives and their checksums. Run it by hand to only check and
# build the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole CI gate (ci.yml) first: a release is built only from a commit that passes it.
  check:
    # A reusable workflow given as ./ is read from the same commit, never from the runner's disk;
    # actionlint 1.7.12 does not parse the $/ form zizmor suggests.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      checks-only: true

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low enough for most distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Windows also gets scrpad.com, the console build for terminals (src/bin/scrpad-console.rs).
          - { target: x86_64-pc-windows-msvc, os: windows-latest, features: console }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain pinned in rust-toolchain.toml. No build cache: release builds start clean,
      # so a poisoned cache from another run can never end up in a published binary.
      - run: rustup toolchain install && rustup target add "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --locked --profile dist --target "$TARGET" --features "$FEATURES"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
      - name: Package
        shell: bash
        run: |
          name="scrpad-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin=scrpad
          [[ "$RUNNER_OS" == Windows ]] && bin=scrpad.exe
          mkdir -p "dist/$name/licenses"
          cp "target/${{ matrix.target }}/dist/$bin" README.md LICENSE "dist/$name/"
          # cmd and PowerShell pick scrpad.com before scrpad.exe for a plain `scrpad`.
          [[ "$RUNNER_OS" == Windows ]] && cp "target/${{ matrix.target }}/dist/scrpad-console.exe" "dist/$name/scrpad.com"
          cp assets/fonts/OFL-*.txt assets/icons/LICENSE-lucide.txt "dist/$name/licenses/"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Menu entry and icon, with install.sh to put them in place.
            install -Dm755 packaging/linux/install.sh "dist/$name/install.sh"
            install -Dm644 packaging/linux/scrpad.desktop "dist/$name/share/applications/scrpad.desktop"
            install -Dm644 assets/app-icon/scrpad-square.svg "dist/$name/share/icons/hicolor/scalable/apps/scrpad.svg"
            install -Dm644 assets/app-icon/scrpad-256.png "dist/$name/share/icons/hicolor/256x256/apps/scrpad.png"
          fi
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --locked --profile dist --target aarch64-apple-darwin --target x86_64-apple-darwin
      - run: packaging/macos/bundle.sh
      - name: Package
        run: |
          name="scrpad-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "dist/$name/licenses"
          mv dist/scrpad.app "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp assets/fonts/OFL-*.txt assets/icons/LICENSE-lucide.txt "dist/$name/licenses/"
          # ditto keeps the bundle's signature and metadata intact, unlike plain zip.
          cd dist && ditto -c -k --keepParent "$name" "$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: dist/*.zip

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum -- * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
