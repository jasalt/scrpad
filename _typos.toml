[files]
# Base64 test vectors and binary-ish assets are not prose.
extend-exclude = ["tests/data/", "assets/fonts/", "*.svg", "Cargo.lock"]

[default.extend-words]
# "PNGs" is split into PN + Gs.
PN = "PN"
# The terminal UI library (ratatui.rs), not a misspelt ratatouille.
ratatui = "ratatui"
# The POSIX open flag O_WRONLY (rustix OFlags::WRONLY in src/handoff.rs).
WRONLY = "WRONLY"
